name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-gen-client
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: modal-gen-client
      - uses: actions/checkout@v7.0.1
        with:
          repository: xiaoqianran/modal-2D
          path: modal-2D
      - uses: actions/checkout@v7.0.1
        with:
          repository: xiaoqianran/modal-2D-client
          path: modal-2D-client
      - uses: actions/checkout@v7.0.1
        with:
          repository: xiaoqianran/modal-3D
          path: modal-3D
      - uses: actions/checkout@v7.0.1
        with:
          repository: xiaoqianran/modal-3D-client
          path: modal-3D-client
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modal-gen-client/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          working-directory: modal-gen-client
      - run: uv lock --check
      - name: Sync dependencies from official PyPI
        env:
          UV_INDEX_URL: https://pypi.org/simple
        run: uv sync --dev --frozen
      - run: uv run ruff format . --check
      - run: uv run ruff check .
      - run: uv run python -m compileall -q modal_gen tests
      - run: uv run pytest -q
      - run: uv build
      - name: Validate installed entrypoint
        run: uv run python -c "from modal_gen.server import main; assert callable(main)"
